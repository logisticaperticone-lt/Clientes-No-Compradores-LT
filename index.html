<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seguimiento CNC</title>
<style>
:root{
  --ink:#1b2733;--muted:#5d6b7a;--line:#dde2e8;--paper:#f3f5f8;--card:#fff;
  --brand:#1f4e78;--brand-d:#173b5a;--brand-soft:#e6eef6;
  --red:#d64545;--red-bg:#fbe9e9;--orange:#e8801a;--orange-bg:#fdf0e0;
  --yellow:#d9a90f;--yellow-bg:#fcf5d9;--green:#2a9a67;--green-bg:#e4f4ec;
  --grey:#98a3b0;--grey-bg:#f3f5f8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.hide{display:none!important}

/* header */
.top{background:var(--brand-d);color:#fff}
.top-in{max-width:1500px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:650;letter-spacing:-.01em}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14);font-size:12.5px}
.pill b{font-weight:650}
.top button.lnk{background:none;border:0;color:#cfe0ef;cursor:pointer;text-decoration:underline;padding:2px 4px}
.tabs{max-width:1500px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;color:#cfe0ef;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:#f2c14e}
.banner{padding:7px 18px;font-size:13px;text-align:center}
.banner.demo{background:#fff3cd;color:#6b5200}
.banner.ro{background:#e2e8f0;color:#334155}

main{max-width:1500px;margin:0 auto;padding:16px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:8px}
.card h3{font-size:14px;margin:14px 0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
p{margin:6px 0}
ul.clean{margin:6px 0;padding-left:20px}
ul.clean li{margin:3px 0}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:130px}
.fld>span{font-size:12px;color:var(--muted)}
.fld select,.fld input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff}
.fld.grow{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.btn{height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;font-weight:600}
.btn:hover{background:var(--brand-d)}
.btn.sec{background:#fff;color:var(--brand)}
.btn.sec:hover{background:var(--brand-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chk{display:inline-flex;align-items:center;gap:6px;height:34px;cursor:pointer}

/* kpis */
.kpis{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:120px}
.kpi b{display:block;font-size:20px;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.red b{color:var(--red)}.kpi.orange b{color:var(--orange)}.kpi.green b{color:var(--green)}
.progress{flex:1;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--grey-bg)}
.bar i{display:block;height:100%}
.bar .r{background:var(--red)}.bar .o{background:var(--orange)}.bar .g{background:var(--green)}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:calc(100vh - 290px);min-height:120px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.grid th{position:sticky;top:0;z-index:2;background:#eef2f6;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:650;white-space:nowrap}
table.grid td{padding:7px 10px;border-bottom:1px solid #eceff3;vertical-align:top}
table.grid tr.row td:first-child{box-shadow:inset 5px 0 0 var(--st,transparent)}
table.grid tr.row{background:var(--st-bg,#fff)}
table.grid tr.row:hover{filter:brightness(.985)}
.st-red{--st:var(--red);--st-bg:var(--red-bg)}
.st-orange{--st:var(--orange);--st-bg:var(--orange-bg)}
.st-yellow{--st:var(--yellow);--st-bg:var(--yellow-bg)}
.st-green{--st:var(--green);--st-bg:var(--green-bg)}
.st-none{--st:var(--grey);--st-bg:#fff}
.cli b{font-weight:650}
.cli .rs{display:block;max-width:230px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11.5px;background:#e9edf2;color:#37424f;white-space:nowrap}
.chip.warn{background:#fde8c8;color:#8a4b00}
.chip.info{background:var(--brand-soft);color:var(--brand-d)}
.chip.neg{background:var(--brand);color:#fff;font-weight:600}
.chip.h-red{background:var(--red);color:#fff}.chip.h-orange{background:var(--orange);color:#fff}.chip.h-yellow{background:var(--yellow);color:#fff}.chip.h-none{background:#e9edf2;color:#37424f}
select.cell,input.cell{width:100%;min-width:150px;height:32px;border:1px solid #c9d1da;border-radius:6px;padding:0 6px;background:#fff}
input.cell{min-width:150px}
select.cell.empty{color:#7a8794}
.ant{color:var(--muted);font-size:12px}
.ant b{font-weight:600;color:#3d4a58}
.bees{font-size:12px;max-width:230px}
.bees b{font-weight:600}
.tick{font-weight:700}
.tick.ok{color:var(--green)}.tick.no{color:var(--grey)}
.pager{display:flex;align-items:center;gap:10px;padding:10px 2px;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* resumen */
.rs-wrap .tw{max-height:calc(100vh - 330px)}
table.sum th,table.sum td{text-align:right;white-space:nowrap;padding:6px 9px}
table.sum th:first-child,table.sum td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:#fff;min-width:190px}
table.sum th:first-child{z-index:3;background:#eef2f6}
table.sum tr.sub td{background:#e8eef5;font-weight:650}
table.sum tr.sub td:first-child{background:#e8eef5}
table.sum tr.tot td{background:#d4e1ee;font-weight:700}
table.sum tr.tot td:first-child{background:#d4e1ee}
table.sum th.ng{text-align:center;background:var(--brand);color:#fff;border-left:2px solid #fff}
table.sum td.b{border-left:2px solid #eef2f6}
table.sum th.bl{border-left:2px solid #fff}
.hm{position:relative}

/* legend */
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin:8px 0}
.sw{width:56px;height:22px;border-radius:5px;border-left:6px solid var(--st);background:var(--st-bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}

/* modal / login */
.ov{position:fixed;inset:0;background:rgba(15,25,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:10px;padding:22px 24px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{font-size:18px;margin-bottom:6px}
.modal .fld{margin:12px 0}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;right:16px;bottom:16px;background:#1b2733;color:#fff;padding:9px 14px;border-radius:7px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80vw}
.toast.err{background:#a33}

/* admin */
.log{background:#0f1923;color:#c8e1c8;font:12px/1.5 Consolas,monospace;border-radius:6px;padding:10px 12px;max-height:240px;overflow:auto;white-space:pre-wrap;margin-top:10px}
.log .e{color:#ff9b9b}.log .w{color:#ffd37a}
textarea.t{width:100%;min-height:140px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12.5px/1.4 Consolas,monospace}
table.mini{border-collapse:collapse;font-size:13px}
table.mini th,table.mini td{border:1px solid var(--line);padding:5px 9px;text-align:right}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th{background:#eef2f6}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:10px 0}
.files .fld input[type=file]{height:auto;padding:6px}
.step{counter-increment:s;margin:4px 0}
ol.steps{padding-left:22px}
ol.steps li{margin:5px 0}

@media (max-width:820px){
  main{padding:12px 10px 60px}
  .tw{max-height:none;border:0;background:none}
  table.grid thead{display:none}
  table.grid,table.grid tbody{display:block}
  table.grid tr.row{display:block;border:1px solid var(--line);border-left:6px solid var(--st);border-radius:8px;margin-bottom:10px;padding:6px 4px}
  table.grid td{display:block;border:0;padding:4px 10px}
  table.grid tr.row td:first-child{box-shadow:none}
  table.grid td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
  select.cell,input.cell{min-width:0}
  .cli .rs{max-width:none}
  .bees{max-width:none}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{transform:translateY(8px);opacity:0}}}
.xv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 16px;margin-top:8px;max-height:320px;overflow:auto}
.xv{padding:3px 0;display:flex;align-items:center;gap:8px;height:auto}
</style>

<script id="main">
'use strict';
/* Copia limpia de la página (se usa para armar el HTML de cierre) */
const PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;

/* ---------------- Constantes ---------------- */
const DIST_CODE = '47311200';
const NEG_ORDER = ['CZA','NABs','MATCH','AGUAS','MARKETPLACE'];
const OBLIG_NEGS = ['CZA','NABs'];
const HORS = ['ACTIVO','CNC U3M','CNC U6M','CNC U9M','CNC U12M','CNC'];
const HOR_SHORT = {'ACTIVO':'Activo','CNC U3M':'U3M','CNC U6M':'U6M','CNC U9M':'U9M','CNC U12M':'U12M','CNC':'+12m'};
const HOR_DESC = {'ACTIVO':'Compró en el mes de corte','CNC U3M':'1 a 3 meses sin comprar','CNC U6M':'4 a 6 meses sin comprar','CNC U9M':'7 a 9 meses sin comprar','CNC U12M':'10 a 12 meses sin comprar','CNC':'Más de 12 meses sin comprar'};
const HOR_COLOR = {'CNC':'red','CNC U12M':'orange','CNC U9M':'yellow','CNC U6M':'none','CNC U3M':'none','ACTIVO':'none'};
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  motivos: ['CAMBIO DE RUBRO','BAJO DROP','CAMBIO DE RAZON SOCIAL','CERRADO POR VACACIONES','CLIENTE CONFLICTIVO','CLIENTE NUEVO','CLIENTE POR CERRAR','COMPRA CON OTRA RAZON SOCIAL','COMPRA EN MAYORISTA','COMPRA EN OTRO LADO','DEBE PLATA','PROBLEMAS CON ARCA','PROBLEMAS CON ENTREGA','CLIENTE DE TEMPORADA','PRECIO','CAMBIO DE PROVEEDOR (COMPETENCIA)','NO SATISFECHO CON EL SERVICIO','ya se activo','cierre def'],
  planes: ['DAR DE BAJA','IR A VER','MEJORAR NEGOCIACION','RETIRAR EDF'],
  mapeo: {'CERVEZAS CMQ':'CZA','UNG':'NABs','AGUAS ECO':'AGUAS','MARKETPLACE ALIMENTOS':'MARKETPLACE','VINO':'MATCH','ADYACENCIAS':'MATCH'},
  beesNeg: {'Beer':'CZA','NAB':'NABs'},
  supervisores: {
    'CORSINO PEDRO':[11,13,7,1,9,10,12,21,26,97],
    'MORENO FERNANDO':[14,16,17,8,3,18,15,25,99,100],
    'ANTUAL PAULA':[4,5,2,95,24],
    'SECO ROBERTO ENRIQUE':[20,19,6,96,98],
    'SIN SUPERVISOR':[50,60,90,92,93,94,0]
  }
};

/* ---------------- Utilidades ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const fmtN = n => (n==null||isNaN(n))?'–':Number(n).toLocaleString('es-AR');
const fmtP = v => (v==null||isNaN(v))?'–':(v*100).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const ymLabel = ym => ym ? MESES[+ym.slice(5,7)-1]+'-'+ym.slice(2,4) : '';
const ymLong = ym => ym ? MESES_L[+ym.slice(5,7)-1]+' '+ym.slice(0,4) : '';
const ymDiff = (a,b) => (+a.slice(0,4)-+b.slice(0,4))*12 + (+a.slice(5,7)-+b.slice(5,7));
const horOf = ms => ms<=0?'ACTIVO':ms<=3?'CNC U3M':ms<=6?'CNC U6M':ms<=9?'CNC U9M':ms<=12?'CNC U12M':'CNC';
const clone = o => o==null?o:JSON.parse(JSON.stringify(o));
const tsFmt = t => { if(!t) return ''; const d=new Date(t); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); };
function toast(msg,err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),err?5000:2600); }
async function sha(s){ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))|0; return 'x'+h; } }
function download(name, text, type){ const b=new Blob([text],{type:type||'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function csvCell(v){ v=v==null?'':String(v); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }

/* Fechas desde Excel / texto -> 'YYYY-MM-DD' */
function toYMD(v){
  if(v==null||v==='') return '';
  if(v instanceof Date){ return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0'); }
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1]+'-'+m[2]+'-'+m[3];
  if((m=s.match(/^(\d{4})-(\d{2})$/))) return m[1]+'-'+m[2]+'-01';
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
const toYM = v => { const d=toYMD(v); return d?d.slice(0,7):''; };

/* ---------------- CSV (con comillas escapadas tipo \" como las de BEES Force) ---------------- */
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false, i=0; const n=text.length;
  if(text.charCodeAt(0)===0xFEFF) i=1;
  for(;i<n;i++){
    const c=text[i];
    if(q){
      if(c==='\\' && text[i+1]==='"'){ f+='"'; i++; }
      else if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else if(c!=='\r') f+=c;
    }
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.length>1||(r[0]||'')!=='');
}
const colIdx = (hdr,...names) => { const H=hdr.map(norm); for(const n of names){ const i=H.indexOf(norm(n)); if(i>=0) return i; } return -1; };
async function readText(file){ return await file.text(); }
async function readXlsxRows(file, sheet){
  if(typeof XLSX==='undefined') await loadSheetJS();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf,{type:'array'});
  const name = sheet && wb.SheetNames.includes(sheet) ? sheet : wb.SheetNames[0];
  return {rows: XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null}), wb, sheet:name};
}
function loadSheetJS(){
  return new Promise((res,rej)=>{
    const urls=['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
    let k=0; const next=()=>{ if(k>=urls.length) return rej(new Error('No se pudo cargar la librería para leer Excel (revisá la conexión).')); const s=document.createElement('script'); s.src=urls[k++]; s.onload=()=>res(); s.onerror=next; document.head.appendChild(s); }; next();
  });
}
async function readTable(file, sheet){
  if(/\.csv$/i.test(file.name)) return {rows: parseCSV(await readText(file))};
  return await readXlsxRows(file, sheet);
}

/* ---------------- Base de datos: Firebase / demo / cierre ---------------- */
function makeMemDB(initial, opts){
  opts=opts||{}; let root=initial||{};
  if(opts.storageKey){ try{ const t=localStorage.getItem(opts.storageKey); if(t) root=JSON.parse(t); }catch(e){} }
  const subs=[];
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=p=>{ let n=root; for(const k of parts(p)){ if(n==null||typeof n!=='object') return null; n=n[k]; } return n===undefined?null:n; };
  const setAt=(p,v)=>{ const ks=parts(p); if(!ks.length){ root=v||{}; return; } let n=root; for(let i=0;i<ks.length-1;i++){ if(n[ks[i]]==null||typeof n[ks[i]]!=='object') n[ks[i]]={}; n=n[ks[i]]; } const l=ks[ks.length-1]; if(v==null) delete n[l]; else n[l]=v; };
  const persist=()=>{ if(opts.storageKey){ try{ localStorage.setItem(opts.storageKey, JSON.stringify(root)); }catch(e){ console.warn('No se pudo guardar en localStorage',e); } } };
  const notify=()=>subs.forEach(s=>s.cb(clone(getAt(s.p))));
  return {
    kind: opts.readonly?'snapshot':'demo',
    async get(p){ return clone(getAt(p)); },
    async set(p,v){ if(opts.readonly) return; setAt(p,clone(v)); persist(); notify(); },
    async update(p,o){ if(opts.readonly) return; for(const k in o) setAt(p+'/'+k, clone(o[k])); persist(); notify(); },
    onValue(p,cb){ const s={p,cb}; subs.push(s); setTimeout(()=>cb(clone(getAt(p))),0); return ()=>{ const i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; }
  };
}
async function makeFirebaseDB(cfg){
  const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
  const app = A.initializeApp(cfg); const db = D.getDatabase(app); const R=p=>D.ref(db,p);
  return {
    kind:'firebase',
    async get(p){ return (await D.get(R(p))).val(); },
    async set(p,v){ return D.set(R(p),v); },
    async update(p,o){ return D.update(R(p),o); },
    onValue(p,cb){ return D.onValue(R(p), s=>cb(s.val())); }
  };
}

/* ---------------- Armado del dataset del mes ---------------- */
function negList(mapeo){
  const set=[...new Set(Object.values(mapeo))];
  return set.sort((a,b)=>{ const ia=NEG_ORDER.indexOf(a), ib=NEG_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b); });
}
function parseClientes(rows){
  let h=0; while(h<5 && colIdx(rows[h]||[],'Cliente')<0) h++;
  const H=rows[h]; if(!H) throw new Error('El archivo de clientes está vacío.');
  const ix={
    id:colIdx(H,'Cliente'), rs:colIdx(H,'Razon social','Razón social'),
    alta:colIdx(H,'Alta fecha'), anul:colIdx(H,'Anulado'),
    rc:colIdx(H,'Fuerza de venta 1 Ruta de venta'), rd:colIdx(H,'Fuerza de venta 1 Descripcion ruta de venta'),
    vc:colIdx(H,'Fuerza de venta 1 Personal comercial'), vd:colIdx(H,'Fuerza de venta 1 Descripcion personal comercial'),
    dv:colIdx(H,'Fuerza de venta 1 Dias de visita')
  };
  const falta=Object.entries(ix).filter(([k,v])=>v<0 && k!=='anul').map(([k])=>k);
  if(falta.length) throw new Error('Al archivo de clientes le faltan columnas: '+falta.join(', ')+'. Tiene que ser la exportación completa de clientes de Chess.');
  const out=[]; let anulados=0;
  for(let r=h+1;r<rows.length;r++){
    const x=rows[r]; if(!x||x[ix.id]==null||x[ix.id]==='') continue;
    if(ix.anul>=0 && norm(x[ix.anul])==='si'){ anulados++; continue; }
    out.push({i:+x[ix.id], s:String(x[ix.rs]||'').trim(), rc:x[ix.rc]==null?0:+x[ix.rc], rd:String(x[ix.rd]||'').trim(),
      vc:x[ix.vc]==null?0:+x[ix.vc], vd:String(x[ix.vd]||'').trim(), dv:String(x[ix.dv]||'').trim(), a:toYMD(x[ix.alta])});
  }
  return {clientes:out, anulados};
}
function parseVenta(rows){
  const H=rows[0]||[];
  if(colIdx(H,'Cod. Cliente')>=0 && colIdx(H,'Descripción Período','Descripcion Periodo')>=0)
    throw new Error('Ese es el export completo de VENTA (cientos de miles de filas). Generá primero la venta resumida (ver "Cómo preparar la venta" más abajo) y cargá ese archivo.');
  const ix={c:colIdx(H,'Cliente'),n:colIdx(H,'Negocio'),p:colIdx(H,'Periodo','Período'),q:colIdx(H,'Cantidad')};
  if(Object.values(ix).some(v=>v<0)) throw new Error('La venta resumida tiene que tener las columnas: Cliente, Negocio, Periodo, Cantidad.');
  const out=[]; 
  for(let r=1;r<rows.length;r++){ const x=rows[r]; if(!x||x[ix.c]==null) continue; const ym=toYM(x[ix.p]); if(!ym) continue; out.push({c:+x[ix.c], n:String(x[ix.n]).trim(), p:ym, q:+x[ix.q]||0}); }
  return out;
}
function buildDataset(clientes, venta, cfg){
  const negs=negList(cfg.mapeo);
  const last={}; let corte='', desde='9999-99'; const sinMapeo={};
  for(const v of venta){
    if(v.p>corte) corte=v.p; if(v.p<desde) desde=v.p;
    const g=cfg.mapeo[v.n]; if(!g){ sinMapeo[v.n]=(sinMapeo[v.n]||0)+1; continue; }
    if(v.q>0){ const k=v.c+'_'+g; if(!last[k]||v.p>last[k]) last[k]=v.p; }
  }
  if(!corte) throw new Error('La venta resumida no tiene filas válidas.');
  const ids=new Set(clientes.map(c=>c.i)); const ventaIds=new Set(venta.map(v=>v.c));
  const recs=clientes.map(c=>{
    const n=negs.map(g=>{
      const u=last[c.i+'_'+g]||'';
      if(u) return [ymDiff(corte,u),0,u];
      return [c.a? ymDiff(corte,c.a.slice(0,7)) : 99, 1, ''];
    });
    return {i:c.i,s:c.s,rc:c.rc,rd:c.rd,vc:c.vc,vd:c.vd,dv:c.dv,a:c.a,n};
  });
  const dist={}; negs.forEach((g,k)=>{ dist[g]={}; HORS.forEach(h=>dist[g][h]=0); recs.forEach(r=>dist[g][horOf(r.n[k][0])]++); });
  return {meta:{corte,desde,negocios:negs,mapeo:cfg.mapeo,nClientes:recs.length,creado:Date.now()}, clientes:recs,
    stats:{dist,ventaFilas:venta.length,ventaSinCliente:[...ventaIds].filter(x=>!ids.has(x)).length,clientesSinVenta:[...ids].filter(x=>!ventaIds.has(x)).length,sinMapeo}};
}
function chunkClientes(recs,size){ const o={}; for(let i=0;i<recs.length;i+=size) o['c'+(i/size)]=JSON.stringify(recs.slice(i,i+size)); return o; }

/* ---------------- Historial (para la evolución mensual del %CNC) ---------------- */
function histFrom(items){ // items: {vd, neg, ms, nv}
  const H={};
  for(const it of items){
    const v=it.vd||'(SIN VENDEDOR)'; const o=H[v]||(H[v]={}); const a=o[it.neg]||(o[it.neg]=new Array(14).fill(0));
    const k=HORS.indexOf(horOf(it.ms));
    a[0]++; a[1+k]++; if(!it.nv){ a[7]++; a[8+k]++; }
  }
  return H; // por vendedor/negocio: [cartera, act,u3,u6,u9,u12,cnc, carteraSinNunca, act,u3,u6,u9,u12,cnc]
}
function histFromDataset(clientes, negs){ const items=[]; for(const c of clientes) c.n.forEach((x,k)=>items.push({vd:c.vd,neg:negs[k],ms:x[0],nv:x[1]})); return histFrom(items); }

/* ---------------- BEES Force ---------------- */
function beesId(code){ code=String(code||'').trim(); return (code.length===14 && code.startsWith(DIST_CODE) && /^\d+$/.test(code))? +code.slice(8) : null; }
function answerOf(s){ s=String(s||'').trim(); if(!s) return ''; try{ const j=JSON.parse(s); return Array.isArray(j)?j.join(', '):String(j); }catch(e){ return s.replace(/^\[\\?"?|\\?"?\]$/g,''); } }
function parseBees(rows, cfg){
  const H=rows[0]||[]; const out={tipo:null,bees:{},beesGen:{},beesFoto:{},filas:Math.max(0,rows.length-1),propias:0,ajenas:0,sinNeg:{}};
  const i={c:colIdx(H,'cliente'),t:colIdx(H,'tarea'),f:colIdx(H,'fecha_tarea','fecha_enviada'),q:colIdx(H,'pregunta'),tp:colIdx(H,'tipo_pregunta'),a:colIdx(H,'subtasks_answers','respuesta'),img:colIdx(H,'link_imagen'),canal:colIdx(H,'canal')};
  if(i.c<0||i.t<0) throw new Error('No reconozco las columnas de este archivo de BEES Force.');
  if(i.img>=0){
    out.tipo='U12M (fotos)';
    for(let r=1;r<rows.length;r++){ const x=rows[r]; const id=beesId(x[i.c]); if(id==null){ out.ajenas++; continue; } out.propias++; out.beesFoto[id]={f:toYMD(x[i.f]),img:/^https?:/.test(x[i.img]||'')?x[i.img]:'',canal:x[i.canal]||''}; }
    return out;
  }
  const porNeg = colIdx(H,'subtasks_answers')>=0;
  out.tipo = porNeg ? 'U90 por negocio' : 'U90 sin compra';
  const groups={};
  for(let r=1;r<rows.length;r++){
    const x=rows[r]; const id=beesId(x[i.c]); if(id==null){ out.ajenas++; continue; } out.propias++;
    const tarea=String(x[i.t]||''); const f=toYMD(x[i.f]); let neg=null, dias=null, m;
    if(porNeg){ m=tarea.match(/pedido de\s+(.+?)\s+en\s+(\d+)\s+d[ií]as/i); if(!m) continue; neg=cfg.beesNeg[m[1].trim()]; dias=+m[2]; if(!neg){ out.sinNeg[m[1].trim()]=(out.sinNeg[m[1].trim()]||0)+1; continue; } }
    else { m=tarea.match(/pedido en\s+(\d+)\s+d[ií]as/i); dias=m?+m[1]:null; neg='*'; }
    const key=id+'|'+neg+'|'+f; const g=groups[key]||(groups[key]={id,neg,f,dias,m:'',c:'',d:[]});
    const tp=norm(x[i.tp]), ans=answerOf(x[i.a]), q=norm(x[i.q]);
    if(!ans) continue;
    if(tp==='freetext') g.c=g.c?g.c+' | '+ans:ans;
    else if(tp==='conditional' && /razon/.test(q)) g.m=g.m?g.m+', '+ans:ans;
    else g.d.push(ans);
  }
  const best={};
  for(const g of Object.values(groups)){ const k=g.id+'|'+g.neg; if(!best[k]||g.f>=best[k].f) best[k]=g; }
  for(const g of Object.values(best)){
    const rec={}; const dd=g.d.join('; '); if(g.m) rec.m=g.m; if(g.c) rec.c=g.c; if(dd) rec.d=dd; if(g.dias!=null) rec.n=g.dias; if(g.f) rec.f=g.f;
    if(g.neg==='*') out.beesGen[g.id]=rec; else out.bees[g.id+'_'+g.neg]=rec;
  }
  return out;
}

/* ---------------- Excel del mes anterior (respuestas + historial) ---------------- */
function parseAnterior(res, cfg){
  const rows=res.rows; let h=0; while(h<6 && colIdx(rows[h]||[],'Cliente')<0) h++;
  const H=rows[h]; const ix={
    c:colIdx(H,'Cliente'), n:colIdx(H,'Negocio (Base Ventas)'), v:colIdx(H,'Vendedor'), uc:colIdx(H,'Última Compra','Ultima Compra'), ms:colIdx(H,'Meses sin compra'),
    m:H.findIndex(x=>/^motivo de no compra.*actual/.test(norm(x))), p:H.findIndex(x=>/^plan de accion.*actual/.test(norm(x)))
  };
  if(ix.c<0||ix.n<0||ix.m<0||ix.p<0) throw new Error('No encuentro las columnas Cliente / Negocio / Motivo / Plan (mes actual) en ese Excel. Tiene que ser el CNC_SEGUIMIENTO del mes anterior.');
  const ant={}, per={}; let nResp=0;
  for(let r=h+1;r<rows.length;r++){
    const x=rows[r]; if(!x||x[ix.c]==null) continue; const g=cfg.mapeo[String(x[ix.n]).trim()]; if(!g) continue;
    const key=x[ix.c]+'_'+g; const m=String(x[ix.m]||'').trim(), p=String(x[ix.p]||'').trim();
    if(m||p){ const a=ant[key]||(ant[key]={}); if(m&&!a.m) a.m=m; if(p&&!a.p) a.p=p; }
    const pk=key; const o=per[pk]||(per[pk]={vd:String(x[ix.v]||'').trim(),neg:g,ms:null,nv:1});
    if(x[ix.uc]!=null&&x[ix.uc]!=='') o.nv=0;
    if(typeof x[ix.ms]==='number') o.ms=o.ms==null?x[ix.ms]:Math.min(o.ms,x[ix.ms]);
  }
  nResp=Object.keys(ant).length;
  let corte=''; const ps=res.wb&&res.wb.Sheets&&res.wb.Sheets['PARAMETROS']; if(ps&&ps.B2) corte=toYM(ps.B2.v);
  const items=Object.values(per).filter(o=>o.ms!=null);
  return {ant, nResp, corte, hist:histFrom(items)};
}
function antFromResp(resp){ const a={}; for(const k in (resp||{})){ const r=resp[k]; if(r.m||r.p||r.t){ const o={}; if(r.m) o.m=r.m; if(r.p) o.p=r.p; if(r.t) o.t=r.t; a[k]=o; } } return a; }

function applyCfg(raw){
  const c=clone(DEFAULT_CFG); raw=raw||{};
  if(raw.lists){ if(raw.lists.motivos) c.motivos=raw.lists.motivos.split('\n').map(x=>x.trim()).filter(Boolean); if(raw.lists.planes) c.planes=raw.lists.planes.split('\n').map(x=>x.trim()).filter(Boolean); }
  if(raw.mapeo) c.mapeo=raw.mapeo;
  c.excluidos=[]; if(raw.excluidos){ try{ c.excluidos=JSON.parse(raw.excluidos).map(String); }catch(e){} }
  if(raw.supervisores){ try{ c.supervisores=JSON.parse(raw.supervisores); }catch(e){} }
  S.cfg=c; S.cfgRaw=raw; S.supMap={};
  for(const [s,l] of Object.entries(c.supervisores)) for(const v of l) S.supMap[v]=s;
  const ms=raw.meses?Object.keys(raw.meses).sort():[]; S.meses=ms;
}

function buildRows(){
  S.rows=[]; S.rowsGen=[]; S.cliById={}; const negs=S.meta.negocios, corte=S.meta.corte;
  const ex=new Set((S.cfg.excluidos||[]).map(String));
  S.clientes=S.clientesAll.filter(c=>!ex.has(String(c.vc)));
  for(const c of S.clientes){
    S.cliById[c.i]=c; c.sup=supOf(c.vc);
    c.sinCompras=c.n.every(x=>x[1]===1);
    c.altaReciente = !!c.a && ymDiff(corte,c.a.slice(0,7))<=3;
    c.n.forEach((x,k)=>{ S.rows.push({key:c.i+'_'+negs[k], c, neg:negs[k], k, ms:x[0], nv:x[1], u:x[2], hor:horOf(x[0])}); });
    // Fila GENERAL: el cliente como comprador de cualquier negocio (la compra más reciente de todos)
    const bought=c.n.map((x,k)=>({x,k})).filter(o=>!o.x[1]);
    let g;
    if(bought.length){ const best=bought.reduce((a,o)=>o.x[0]<a.x[0]?o:a); g={ms:best.x[0],nv:0,u:best.x[2],ln:negs[best.k]}; }
    else { g={ms:Math.min(...c.n.map(x=>x[0])),nv:1,u:'',ln:''}; }
    S.rowsGen.push({key:c.i+'_GENERAL', c, neg:'GENERAL', k:-1, ms:g.ms, nv:g.nv, u:g.u, ln:g.ln, hor:horOf(g.ms)});
  }
}

function optsHTML(list,val,ph){ let h='<option value="">'+esc(ph)+'</option>'; let found=false; for(const o of list){ if(o===val) found=true; h+='<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'; } if(val&&!found) h+='<option selected>'+esc(val)+'</option>'; return h; }
function vendOpts(){ const m=new Map(); for(const c of S.clientes) if(inScope(c)) m.set(c.vc,c.vd||'(sin vendedor)'); return [...m].sort((a,b)=>a[1].localeCompare(b[1])); }
function rutaOpts(vc){ const m=new Set(); for(const c of S.clientes) if(inScope(c)&&(vc===''||c.vc==vc)) m.add(c.rd); return [...m].sort(); }

}
function selHTML(id,label,opts,val){ return '<label class="fld"><span>'+esc(label)+'</span><select id="'+id+'">'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>'; }

function patchRow(key){
  const tr=document.querySelector('tr[data-key="'+key+'"]'); if(!tr) return;
  const x=S.resp[key]||{};
  if(S.tab==='ob'){ tr.className='row '+ST_CLS[stOf(x)]; }
  else { const t=tr.querySelector('.tick'); if(t){ t.className='tick '+(x.m?'ok':'no'); t.textContent=x.m?'✔':'–'; } }
  tr.querySelectorAll('.cell').forEach(el=>{ if(document.activeElement===el) return; const v=x[el.dataset.f]||''; if(el.tagName==='SELECT'){ el.innerHTML=optsHTML(el.dataset.f==='m'?S.cfg.motivos:S.cfg.planes,v,el.dataset.f==='m'?'Elegir motivo…':'Elegir plan…'); el.classList.toggle('empty',!v); } else el.value=v; });
}
async function saveResp(key,f,v){
  if(S.readonly) return;
  const cur=Object.assign({},S.resp[key]||{}); if(v) cur[f]=v; else delete cur[f];
  const upd={}; upd[f]=v||null; upd.u=S.user.name; upd.ts=Date.now();
  if(!cur.m&&!cur.p&&!cur.t){ delete S.resp[key]; await S.db.set(respPath(key),null); }
  else { cur.u=S.user.name; cur.ts=upd.ts; S.resp[key]=cur; await S.db.update(respPath(key),upd); }
  patchRow(key); updateKpis();
}
function bindTable(root){
  root.addEventListener('change',e=>{ const el=e.target.closest('.cell'); if(!el) return; saveResp(el.dataset.key,el.dataset.f,el.value.trim()).catch(err=>toast('No se pudo guardar: '+err.message,true)); });
  root.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.matches('input.cell')) e.target.blur(); });
}
function searchMatch(r,q){ if(!q) return true; const t=norm(q); return String(r.c.i).includes(t) || norm(r.c.s).includes(t); }
function exportRows(rows,name){
  const head=['Cliente','Razón social','Supervisor','Vendedor','Ruta','Días de visita','Negocio','Horizonte','Meses sin compra','Última compra','Nunca compró','Motivo BEES','Días BEES','Motivo','Plan de acción','Comentario','Motivo mes anterior','Plan mes anterior','Respondió','Fecha respuesta'];
  const L=[head.join(';')];
  for(const r of rows){ const x=S.resp[r.key]||{}, a=S.ant[r.key]||{}, b=S.bees[r.key]||S.beesGen[r.c.i]||{};
    L.push([r.c.i,r.c.s,r.c.sup,r.c.vd,r.c.rd,r.c.dv,r.neg,HOR_SHORT[r.hor],r.ms,r.u,r.nv?'SI':'NO',b.m||'',b.n!=null?b.n:'',x.m||'',x.p||'',x.t||'',a.m||'',a.p||'',x.u||'',x.ts?tsFmt(x.ts):''].map(csvCell).join(';')); }
  download(name+'_'+S.mes+'.csv','﻿'+L.join('\r\n'),'text/csv;charset=utf-8');
}

/* ---------------- OBLIGATORIO ---------------- */
function obFiltered(full){
  const u=S.ui.ob;
  let rows=obRows().filter(r=>inScope(r.c));
  if(u.vend!=='') rows=rows.filter(r=>String(r.c.vc)===String(u.vend));
  if(u.ruta) rows=rows.filter(r=>r.c.rd===u.ruta);
  if(u.neg) rows=rows.filter(r=>r.neg===u.neg);
  if(!full) return rows;
  if(u.est) rows=rows.filter(r=>stOf(S.resp[r.key])===u.est);
  if(u.q) rows=rows.filter(r=>searchMatch(r,u.q));
  const ord={sin:0,plan:1,ok:2};
  rows.sort((a,b)=>{
    if(u.sort==='pend'){ const d=ord[stOf(S.resp[a.key])]-ord[stOf(S.resp[b.key])]; if(d) return d; }
    if(u.sort==='ms'){ const d=b.ms-a.ms; if(d) return d; }
    return (a.c.vd||'').localeCompare(b.c.vd||'')||a.c.rd.localeCompare(b.c.rd)||a.c.i-b.c.i||a.neg.localeCompare(b.neg);
  });
  return rows;
}
function viewOb(){
  const u=S.ui.ob; const vs=vendOpts(); if(u.vend!==''&&!vs.some(v=>String(v[0])===String(u.vend))) u.vend='';

   selHTML('f-vend','Vendedor',[['','Todos'],...vs],u.vend)+selHTML('f-ruta','Ruta',[['','Todas'],...rutaOpts(u.vend).map(x=>[x,x])],u.ruta)+
   selHTML('f-neg','Negocio',[['','CZA y NABs'],...OBLIG_NEGS.map(n=>[n,n])],u.neg)+
   selHTML('f-est','Estado',[['','Todos'],['sin','Sin motivo (rojo)'],['plan','Falta plan (naranja)'],['ok','Completos (verde)']],u.est)+
   selHTML('f-sort','Ordenar por',[['ruta','Vendedor y ruta'],['pend','Pendientes primero'],['ms','Más meses sin comprar']],u.sort)+
   '<label class="fld grow"><span>Buscar cliente</span><input id="f-q" placeholder="Código o razón social" value="'+esc(u.q)+'"></label><button class="btn sec" id="exp">Exportar CSV</button></div><div id="ob-res"></div>';
  const rerender=()=>{ u.page=0; viewOb(); };
  const bind=(id,k,reset)=>{ const el=$('#'+id); el.onchange=()=>{ u[k]=el.value; if(k==='vend') u.ruta=''; u.page=0; reset?rerender():refreshOb(); }; };

  refreshOb();
}
function refreshOb(){
  const u=S.ui.ob; const rows=obFiltered(true); const page=rows.slice(u.page*u.ps,(u.page+1)*u.ps);
  $('#ob-kpis').innerHTML=kpiHTML(avance(obFiltered(false)));
  $('#ob-res').innerHTML = rows.length ? '<div class="tw"><table class="grid"><thead><tr><th>Cliente</th><th>Vendedor y ruta</th><th>Negocio</th><th>BEES Force</th><th>Mes anterior</th><th>Motivo de no compra</th><th>Plan de acción</th><th>Comentario</th></tr></thead><tbody>'+page.map(trOb).join('')+'</tbody></table></div>'+pagerHTML(rows.length,u)

function bindPager(root,st,fn){

  const ps=$('[data-ps]',root); if(ps) ps.onchange=()=>{ st.ps=+ps.value; st.page=0; fn(); };

/* ---------------- GENERAL ---------------- */
function geFiltered(){
  const u=S.ui.ge;
  let rows=(u.neg==='GENERAL'?S.rowsGen:S.rows).filter(r=>inScope(r.c) && u.hors.includes(r.hor));
  if(u.vend!=='') rows=rows.filter(r=>String(r.c.vc)===String(u.vend));
  if(u.ruta) rows=rows.filter(r=>r.c.rd===u.ruta);
  if(u.neg&&u.neg!=='GENERAL') rows=rows.filter(r=>r.neg===u.neg);
  if(u.nv==='ocultar') rows=rows.filter(r=>!(r.nv&&!r.c.sinCompras)); else if(u.nv==='solo') rows=rows.filter(r=>r.nv&&!r.c.sinCompras);
  if(u.resp==='pend') rows=rows.filter(r=>!(S.resp[r.key]&&S.resp[r.key].m)); else if(u.resp==='ok') rows=rows.filter(r=>S.resp[r.key]&&S.resp[r.key].m);
  if(u.q) rows=rows.filter(r=>searchMatch(r,u.q));

function dayRank(d){ if(!d) return [9,99,'']; const p=d.split(',').map(x=>x.trim()); return [p.length>1?2:1, DIAS_ORD.indexOf(p[0])<0?98:DIAS_ORD.indexOf(p[0]), d]; }
function addCells(a,b){ return a.map((v,i)=>v+b[i]); }
function rsAggregate(by,excludeNv){
  const G=new Map(), negs=S.meta.negocios;
  for(const c of S.clientes){ if(!inScope(c)) continue;
    let key,label;
    if(by==='vend'){ key='v'+c.vc; label=c.vd||'(sin vendedor)'; }
    else if(by==='ruta'){ key='r'+c.rc+'|'+c.rd; label=c.rd; }
    else { key='d'+(c.dv||''); label=c.dv||'SIN DÍA'; }
    let g=G.get(key); if(!g){ g={key,label,vend:c.vd||'(sin vendedor)',sup:c.sup,dv:c.dv,cells:{}}; negs.forEach(n=>g.cells[n]=new Array(7).fill(0)); G.set(key,g); }
    c.n.forEach((x,k)=>{ if(excludeNv&&x[1]) return; const a=g.cells[negs[k]]; a[0]++; a[1+HORS.indexOf(horOf(x[0]))]++; });
  }
  return [...G.values()];
}
function sumGroups(list,negs){ const cells={}; negs.forEach(n=>cells[n]=new Array(7).fill(0)); list.forEach(g=>negs.forEach(n=>cells[n]=addCells(cells[n],g.cells[n]))); return cells; }
function rsCells(cells,negs,mode){
  let h='';
  for(const n of negs){ const a=cells[n], cart=a[0]; const cnc=a[2]+a[3]+a[4]+a[5]+a[6]; const pc=cart?cnc/cart:0;
    const f=v=>mode==='pct'?fmtP(cart?v/cart:0):fmtN(v);
    h+='<td class="num b">'+fmtN(cart)+'</td><td class="num">'+f(a[1])+'</td>'+[2,3,4,5,6].map(i=>'<td class="num">'+f(a[i])+'</td>').join('')+
       '<td class="num" style="font-weight:650">'+f(cnc)+'</td>'+(mode==='pct'?'':'<td class="num" style="background:rgba(214,69,69,'+Math.min(.5,pc*1.1).toFixed(2)+')">'+fmtP(pc)+'</td>');
  }
  return h;
}

    groups.forEach(g=>L.push([ymLabel(S.meta.corte),g.label,...negs.flatMap(n=>{ const a=g.cells[n]; const cnc=a[2]+a[3]+a[4]+a[5]+a[6]; return [...a.slice(0,7),cnc,a[0]?(cnc/a[0]*100).toFixed(1).replace('.',','):'']; })].map(csvCell).join(';')));

const PREPARAR_PY = `# preparar_venta.py  -  convierte el export completo de VENTA (Chess) en la "venta resumida" que carga el #ADMIN.
# Uso (Windows):   pip install openpyxl     y despues     python preparar_venta.py VENTA.xlsx
# Genera venta_resumida.csv con las columnas: Cliente, Negocio, Periodo, Cantidad (tarda unos minutos).
# Columnas del export de VENTA que usa (numeradas desde 1 como en Excel): E=Cod. Cliente, C=Descripcion Periodo, AJ=Descripcion del negocio, AP=Cantidades Totales.
import sys, csv, collections, openpyxl
src = sys.argv[1] if len(sys.argv) > 1 else 'VENTA.xlsx'
C_CLI, C_PER, C_NEG, C_QTY = 4, 2, 35, 41   # posiciones (base 0): E, C, AJ, AP
wb = openpyxl.load_workbook(src, read_only=True, data_only=True)
ws = wb[wb.sheetnames[0]]
acc = collections.defaultdict(float)
for r in ws.iter_rows(min_row=2, values_only=True):
    if r[C_CLI] is None or r[C_PER] is None: continue
    p = r[C_PER]
    p = p.strftime('%Y-%m-01') if hasattr(p, 'strftime') else str(p)[:7] + '-01'
    acc[(r[C_CLI], str(r[C_NEG]).strip(), p)] += (r[C_QTY] or 0)
with open('venta_resumida.csv', 'w', newline='', encoding='utf-8') as f:
    w = csv.writer(f); w.writerow(['Cliente', 'Negocio', 'Periodo', 'Cantidad'])
    for (c, n, p), q in sorted(acc.items(), key=lambda x: (str(x[0][0]), x[0][1], x[0][2])):
        if q: w.writerow([c, n, p, round(q, 2)])
print('Listo: venta_resumida.csv', len(acc), 'filas')
`;

  const l=[...m.values()].sort((a,b)=>a.vd.localeCompare(b.vd));
  const nEx=S.clientesAll.length-S.clientes.length;
  return '<div class="card"><h2>Vendedores a excluir</h2><p class="muted">Tildá los vendedores que no querés seguir (por ejemplo SUPERMERCADOS o MOSTRADOR). Sus clientes desaparecen de OBLIGATORIO, GENERAL y RESUMEN, y no cuentan en los porcentajes. Se puede deshacer cuando quieras y no hace falta volver a cargar el mes.'+(nEx?' Ahora hay <b>'+fmtN(nEx)+'</b> clientes excluidos.':'')+'</p><div class="xv-list">'+l.map(o=>'<label class="chk xv"><input type="checkbox" data-xv="'+esc(o.vc)+'"'+(ex.has(o.vc)?' checked':'')+'> <span>'+esc(o.vd)+' <span class="muted small">('+esc(o.vc)+') · '+fmtN(o.n)+' clientes</span></span></label>').join('')+'</div><button class="btn" id="x-save" style="margin-top:10px">Guardar exclusiones</button></div>';
}
function adminBind(){
  const ps=$('#a-prevsel'); ps.onchange=()=>$('#a-prevbox').classList.toggle('hide',ps.value!=='xlsx');
  $('#a-proc').onclick=()=>adminProcess().catch(e=>{ alog('Error: '+e.message,'e'); toast(e.message,true); });
  $('#a-pub').onclick=()=>adminPublish().catch(e=>{ alog('Error: '+e.message,'e'); toast(e.message,true); });
  $('#b-go').onclick=()=>adminBees().catch(e=>toast(e.message,true));
  $('#c-snap').onclick=adminSnapshot; $('#c-csv').onclick=()=>exportRows(S.rows,'respuestas_completo');
  $('#py-dl').onclick=()=>download('preparar_venta.py',PREPARAR_PY,'text/x-python');
  const xs=$('#x-save'); if(xs) xs.onclick=async()=>{ const l=$$('[data-xv]').filter(i=>i.checked).map(i=>i.dataset.xv); await S.db.set('cnc/config/excluidos',JSON.stringify(l)); await loadConfig(); buildRows(); toast(l.length?l.length+' vendedores excluidos. Ya no aparecen en ninguna pestaña.':'No hay vendedores excluidos'); viewAdmin(); };
  $('#l-save').onclick=async()=>{ await S.db.set('cnc/config/lists',{motivos:$('#l-mot').value.split('\n').map(x=>x.trim()).filter(Boolean).join('\n'),planes:$('#l-pla').value.split('\n').map(x=>x.trim()).filter(Boolean).join('\n')}); await loadConfig(); toast('Listas guardadas'); };
  $('#m-save').onclick=async()=>{ const m={}; $$('[data-mk]').forEach(i=>{ if(i.value.trim()) m[i.dataset.mk]=i.value.trim(); }); await S.db.set('cnc/config/mapeo',m); await loadConfig(); toast('Mapeo guardado. Volvé a procesar y publicar el mes para aplicarlo.'); };
  $('#s-save').onclick=async()=>{ try{ const j=JSON.parse($('#s-json').value); await S.db.set('cnc/config/supervisores',JSON.stringify(j)); await loadConfig(); if(S.meta) buildRows(); toast('Supervisores guardados'); }catch(e){ toast('El JSON no es válido: '+e.message,true); } };
  $('#pin-save').onclick=async()=>{ const v=$('#pin-new').value; if(v.length<4){ toast('El PIN tiene que tener 4 o más caracteres.',true); return; } const h=await sha(v); await S.db.set('cnc/config/adminHash',h); S.cfgRaw.adminHash=h; $('#pin-new').value=''; toast('PIN cambiado'); };
}
async function adminProcess(){
  S.pending=null; $('#a-pub').disabled=true; $('#ad-prev').innerHTML=''; const L=$('#ad-log'); L.innerHTML='';
  const fC=$('#a-cli').files[0], fV=$('#a-ven').files[0]; const prevMode=$('#a-prevsel').value; const fP=$('#a-prev').files[0];
  if(!fC||!fV) throw new Error('Faltan el archivo de clientes activos y el de venta resumida.');
  if(prevMode==='xlsx'&&!fP) throw new Error('Elegiste importar desde el Excel anterior pero no lo cargaste.');
  alog('Leyendo clientes activos…'); const rc=await readTable(fC); const {clientes,anulados}=parseClientes(rc.rows); alog(fmtN(clientes.length)+' clientes activos'+(anulados?' ('+fmtN(anulados)+' anulados descartados)':'')+'.');
  alog('Leyendo venta resumida…'); const rv=await readTable(fV); const venta=parseVenta(rv.rows); alog(fmtN(venta.length)+' filas de venta.');
  const ds=buildDataset(clientes,venta,S.cfg); alog('Mes de corte: '+ymLong(ds.meta.corte)+' · datos desde '+ymLabel(ds.meta.desde)+'.');
  Object.keys(ds.stats.sinMapeo).forEach(n=>alog('Negocio sin mapear (se ignora): "'+n+'" ('+ds.stats.sinMapeo[n]+' filas). Agregalo en el mapeo si corresponde.','w'));
  if(ds.stats.ventaSinCliente) alog(fmtN(ds.stats.ventaSinCliente)+' clientes con venta no están en la base de activos (anulados o fuera de la cartera). Se ignoran.','w');
  if(ds.stats.clientesSinVenta) alog(fmtN(ds.stats.clientesSinVenta)+' clientes activos no tienen ninguna venta en el período.','w');
  const p={dataset:ds,bees:{bees:{},beesGen:{},beesFoto:{}},prev:prevMode,ant:null,histPrev:null,prevCorte:''};
  const bf=[...$('#a-bees').files];
  for(const f of bf){ alog('BEES: '+f.name+'…'); const r=parseBees(parseCSV(await readText(f)),S.cfg); alog('  '+r.tipo+': '+fmtN(r.filas)+' filas, '+fmtN(r.propias)+' de tu distribuidor, '+fmtN(r.ajenas)+' de otros distribuidores (ignoradas).'+(Object.keys(r.sinNeg).length?' Negocios BEES sin mapear: '+Object.keys(r.sinNeg).join(', '):''), r.propias?'':'w');
    Object.assign(p.bees.bees,r.bees); Object.assign(p.bees.beesGen,r.beesGen); Object.assign(p.bees.beesFoto,r.beesFoto); }
  if(prevMode==='xlsx'){ alog('Leyendo Excel del mes anterior…'); const rp=await readXlsxRows(fP,'BASE_CNC'); const a=parseAnterior(rp,S.cfg); p.ant=a.ant; p.histPrev=a.hist; p.prevCorte=a.corte; alog(fmtN(a.nResp)+' respuestas (motivo/plan) traídas del Excel'+(a.corte?' · corte '+ymLong(a.corte):'')+'.'); }
  if(prevMode==='app' && S.cfgRaw.mesActivo===ds.meta.corte){ alog('El mes a publicar es el mismo que el activo: no se vuelven a traer respuestas anteriores (se conservan las que ya tiene).','w'); p.prev='none'; }
  S.pending=p;
  const negs=ds.meta.negocios; let t='<h3>Revisión antes de publicar</h3><p>'+fmtN(ds.meta.nClientes)+' clientes · '+negs.length+' negocios · corte '+esc(ymLong(ds.meta.corte))+'</p><div class="tw" style="max-height:none"><table class="mini"><thead><tr><th>Negocio</th>'+HORS.map(h=>'<th>'+HOR_SHORT[h]+'</th>').join('')+'<th>Total</th></tr></thead><tbody>'+negs.map(n=>'<tr><td>'+esc(n)+'</td>'+HORS.map(h=>'<td>'+fmtN(ds.stats.dist[n][h])+'</td>').join('')+'<td>'+fmtN(ds.meta.nClientes)+'</td></tr>').join('')+'</tbody></table></div><p class="muted small">Chequeá que el total coincida con tus clientes activos y que el corte sea el mes correcto antes de publicar.</p>';
  $('#ad-prev').innerHTML=t; $('#a-pub').disabled=false; alog('Listo para publicar.');
}
async function adminPublish(){
  const p=S.pending; if(!p) throw new Error('Primero procesá los archivos.');
  const ds=p.dataset, mes=ds.meta.corte, b='cnc/meses/'+mes, same=S.cfgRaw.mesActivo===mes;
  $('#a-pub').disabled=true; alog('Publicando '+ymLong(mes)+'…');
  await S.db.set(b+'/meta',ds.meta); await S.db.set(b+'/base',chunkClientes(ds.clientes,400)); alog('Clientes publicados.');
  if(Object.keys(p.bees.bees).length||Object.keys(p.bees.beesGen).length||Object.keys(p.bees.beesFoto).length){ await S.db.set(b+'/bees',p.bees.bees); await S.db.set(b+'/beesGen',p.bees.beesGen); await S.db.set(b+'/beesFoto',p.bees.beesFoto); alog('BEES Force publicado.'); }
  if(p.prev==='app' && !same){ const pr=await S.db.get('cnc/meses/'+S.cfgRaw.mesActivo+'/resp'); const a=antFromResp(pr); await S.db.set(b+'/ant',a); alog(fmtN(Object.keys(a).length)+' respuestas del mes anterior traídas.'); }
  else if(p.prev==='xlsx'){ await S.db.set(b+'/ant',p.ant); if(p.histPrev&&p.prevCorte&&p.prevCorte!==mes) await S.db.set('cnc/hist/'+p.prevCorte,p.histPrev); alog('Respuestas del Excel anterior publicadas.'); }
  { const ex=new Set((S.cfg.excluidos||[]).map(String)); await S.db.set('cnc/hist/'+mes,histFromDataset(ds.clientes.filter(c=>!ex.has(String(c.vc))),ds.meta.negocios)); }
  await S.db.update('cnc/config',{mesActivo:mes}); await S.db.set('cnc/config/meses/'+mes,true);
  await loadConfig(); await loadMonth(mes); S.pending=null; alog('Listo. Mes activo: '+ymLong(mes)+'.'); toast('Mes publicado'); shell(); S.tab='ad'; $$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t==='ad')); renderView();
}
async function adminBees(){
  const fs=[...$('#b-files').files]; if(!fs.length) throw new Error('Elegí uno o más archivos de BEES Force.');
  const acc={bees:Object.assign({},S.bees),beesGen:Object.assign({},S.beesGen),beesFoto:Object.assign({},S.beesFoto)}; const msgs=[];
  for(const f of fs){ const r=parseBees(parseCSV(await readText(f)),S.cfg); Object.assign(acc.bees,r.bees); Object.assign(acc.beesGen,r.beesGen); Object.assign(acc.beesFoto,r.beesFoto); msgs.push(f.name+': '+r.tipo+', '+r.propias+' filas tuyas de '+r.filas); }
  const b='cnc/meses/'+S.mes; await S.db.set(b+'/bees',acc.bees); await S.db.set(b+'/beesGen',acc.beesGen); await S.db.set(b+'/beesFoto',acc.beesFoto);
  S.bees=acc.bees; S.beesGen=acc.beesGen; S.beesFoto=acc.beesFoto; toast('BEES cargado · '+msgs.join(' · ')); 
}
async function adminSnapshot(){
  const cfg=S.cfgRaw; const conf={mesActivo:S.mes,meses:{[S.mes]:true}}; ['lists','mapeo','supervisores','excluidos'].forEach(k=>{ if(cfg[k]!==undefined) conf[k]=cfg[k]; });
  const mesNode={meta:S.meta,base:S.baseRaw}; if(Object.keys(S.resp).length) mesNode.resp=S.resp; if(Object.keys(S.ant).length) mesNode.ant=S.ant; if(Object.keys(S.bees).length) mesNode.bees=S.bees; if(Object.keys(S.beesGen).length) mesNode.beesGen=S.beesGen; if(Object.keys(S.beesFoto).length) mesNode.beesFoto=S.beesFoto;
  const tree={cnc:{config:conf,hist:S.hist,meses:{[S.mes]:mesNode}}};
  const json=JSON.stringify(tree).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  let html=PRISTINE;
  html=html.replace('<div id="app"></div>',()=>'<div id="app"></div>\n<script id="snapshot-data">window.__SNAPSHOT__='+json+';<\/script>');
  download('CNC_cierre_'+S.mes+'.html',html,'text/html;charset=utf-8'); toast('Cierre de '+ymLong(S.mes)+' descargado');
}

/* ---------------- Arranque ---------------- */
async function startApp(){
  try{
    if(!S.db){
      if(window.__SNAPSHOT__){ S.mode='snapshot'; S.db=makeMemDB(window.__SNAPSHOT__,{readonly:true}); }
      else if(FIREBASE_CONFIG.apiKey==='PEGAR_ACA'){ S.mode='demo'; S.db=makeMemDB({},{storageKey:'cnc_demo_db'}); }
      else { S.mode='live'; S.db=await makeFirebaseDB(FIREBASE_CONFIG); }
    }
    await loadConfig();
    if(!S.user){
      let u=null; try{ u=JSON.parse(localStorage.getItem('cnc_user')||'null'); }catch(e){}
      if(u && (u.all || S.cfg.supervisores[u.sup] || u.sup==='SIN SUPERVISOR')) S.user={name:u.name,sup:u.sup,all:!!u.all,admin:false};
      if(!S.user) await loginFlow();
      S.viewAs='*';
    }
    if(!S.user.admin && S.mode!=='snapshot' && sessionStorage.getItem('cnc_admin')==='1' && S.cfgRaw.adminHash) S.user.admin=true;
    S.tab='info';
    await loadMonth(S.cfgRaw.mesActivo||null);
    shell(); renderView();
  }catch(e){
    console.error(e);
    $('#app').innerHTML='<div class="card" style="margin:20px"><h2>No se pudo conectar</h2><p>'+esc(e.message||e)+'</p><p class="muted">Revisá la configuración de Firebase (FIREBASE_CONFIG) y las reglas de la base de datos.</p></div>';
  }
}
startApp();
</script>
